<style>
#dash-root { --pc-teal: #007484; --pc-deep: #04474D;
  --pc-c1: #007484; --pc-c2: #04474D; --pc-c3: #5A5A5A; --pc-c4: #8FA9AD; --pc-c5: #B8A9F0;
  --pc-c1-tint: #7FB9C1; --pc-lav: #D3CAFE; --pc-neg: #CC2200; --pc-pol-neg: #B85F1E; --pc-pol-mix: #D9C08F; --pc-bg-neg: #FCE1DD; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #dash-root { --pc-c1: #3FB6C4; --pc-c2: #A7E3EA; --pc-c3: #B0B0B0; --pc-c4: #6C8C91; --pc-c5: #9C8CE6; --pc-c1-tint: #2A6F78; --pc-lav: #8E7FD6; --pc-neg: #FF6B57; --pc-pol-neg: #E08A4A; --pc-pol-mix: #A8946A; --pc-bg-neg: rgba(255, 107, 87, 0.20); } }
:root[data-theme="dark"] #dash-root { --pc-c1: #3FB6C4; --pc-c2: #A7E3EA; --pc-c3: #B0B0B0; --pc-c4: #6C8C91; --pc-c5: #9C8CE6; --pc-c1-tint: #2A6F78; --pc-lav: #8E7FD6; --pc-neg: #FF6B57; --pc-pol-neg: #E08A4A; --pc-pol-mix: #A8946A; --pc-bg-neg: rgba(255, 107, 87, 0.20); }
.pc { font-family: var(--font-anthropic-sans); color: var(--color-fg); font-variant-numeric: tabular-nums; }
.pc *, .pc *::before, .pc *::after { box-sizing: border-box; }
.pc-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--cds-gap-sm); margin-bottom: var(--cds-gap-md); }
.pc-brand { font-family: var(--font-anthropic-sans); font-size: calc(var(--cds-font-size-title) * 1.25); font-weight: 600; line-height: 1.15; color: var(--color-fg); margin: 0; }
.pc-brand b { color: var(--pc-teal); font-weight: 600; }
.pc-week { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 6px 0 0; }
.pc-sub { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.pc-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 var(--cds-gap-lg); }
.pc-tab { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg); cursor: pointer; }
.pc-tab[aria-selected="true"] { background: var(--pc-teal); border-color: var(--pc-teal); color: #fff; }
.pc-tab.later { color: var(--color-fg-muted); border-style: dashed; }
.pc-panel[hidden] { display: none; }
.pc-ptitle { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm); margin: 0 0 var(--cds-gap-md); }
.pc-ptitle h2 { font-size: var(--cds-font-size-title); font-family: var(--font-anthropic-sans); font-weight: 600; margin: 0; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--pc-teal) 14%, transparent); color: var(--color-fg); }
.chip.ph { background: color-mix(in srgb, var(--color-fg-muted) 16%, transparent); }
.sec { margin: var(--cds-gap-xl) 0 var(--cds-gap-sm); display: flex; align-items: baseline; gap: var(--cds-gap-sm); }
.sec .n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--pc-teal); color: #fff; font-size: 12px; }
.sec h3 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: var(--cds-gap-md); }
.grid.tiles { grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 30rem), 1fr)); }
.card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); min-width: 0; }
.card h4 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); margin: 0 0 4px; }
.note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.45; margin: 6px 0 0; }
.card > .note:first-of-type { margin-top: 0; margin-bottom: 8px; }
.tile .lab { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-muted); }
.tile .big { font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-title); font-weight: 500; margin: 4px 0; line-height: 1.15; }
.tile .foot { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.pill { font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--color-border-line); white-space: nowrap; }
.pos { color: var(--color-ok); } .neg { color: var(--color-bad); } .flat { color: var(--color-fg-muted); }
.pill.pos { border-color: color-mix(in srgb, var(--color-ok) 40%, transparent); }
.pill.neg { border-color: color-mix(in srgb, var(--color-bad) 40%, transparent); }
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: right; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--color-fg-muted); padding: 6px 8px; border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 6px 8px; border-bottom: 1px solid color-mix(in srgb, var(--color-border-line) 60%, transparent); vertical-align: top; }
table.t td.bgv { font-weight: 700; }
table.t td.bg-pos { background: color-mix(in srgb, var(--color-ok) 12%, transparent); }
table.t td.bg-neg { background: var(--pc-bg-neg); }
table.t tr.tot td { font-weight: 600; border-top: 1px solid var(--color-border-line); }
table.t tr.child td:first-child { padding-left: 24px; color: var(--color-fg-muted); }
table.t tr.secrow td { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-fg-muted); padding-top: 12px; }
table.t td .sm { display: block; font-size: 11px; color: var(--color-fg-muted); }
table.t td .desc { display: block; font-size: 11px; color: var(--color-fg-muted); max-width: 32rem; }
table.t tr.bucket { cursor: pointer; }
table.t tr.bucket td:first-child::before { content: "▸  "; color: var(--color-fg-muted); }
table.t tr.bucket.open td:first-child::before { content: "▾  "; }
.hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-md); margin-bottom: var(--cds-gap-md); }
.hl .box { border-radius: var(--cds-radius); padding: var(--cds-pad-md) var(--cds-pad-lg); border: 1px solid var(--color-border-line); }
.hl .box.good { border-left: 4px solid var(--color-ok); background: color-mix(in srgb, var(--color-ok) 10%, transparent); }
.hl .box.watch { border-left: 4px solid var(--color-bad); background: var(--pc-bg-neg); }
.hl .box h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.hl ul, ul.lst { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.ph-card { border: 1px dashed var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); }
.ph-card h4 { margin: 0 0 6px; font-size: var(--cds-font-size-body); }
.ph-card ul { margin: 6px 0; padding-left: 18px; font-size: 13px; color: var(--color-fg-muted); line-height: 1.5; }
.decision { border-left: 4px solid var(--pc-teal); padding: 8px 12px; background: color-mix(in srgb, var(--pc-teal) 8%, transparent); border-radius: var(--cds-radius); font-size: 13px; margin-bottom: var(--cds-gap-md); }
.lede { font-size: var(--cds-font-size-body); line-height: 1.55; margin: 0 0 6px; }
.chart { position: relative; min-height: 220px; }
.spark { position: relative; height: 38px; margin-top: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; z-index: 5; display: none; }
.tip .k { color: var(--cds-text-secondary); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tree { display: grid; grid-template-columns: minmax(0, max-content); justify-content: start; gap: var(--cds-gap-md); }
.tree > .card { max-width: 100%; }
.tree .eq .node { flex: 0 0 auto; min-width: 9.5rem; }
.polbar { display: flex; width: 104px; height: 10px; margin: 0 auto; border-radius: 5px; overflow: hidden; }
.polbar span { display: block; height: 100%; }
table.t tr:has(.polbar) td { vertical-align: middle; }
.hbar { width: 100%; min-width: 6rem; height: 10px; }
.hbar span { display: block; height: 100%; margin: 0 auto; border-radius: 5px; background: var(--pc-c2); }
table.t td:has(.hbar) { width: 50%; }
table.t tr:has(.hbar) td { vertical-align: middle; }
table.t th[data-field="share_of_neg"], table.t th[data-field="share_tw"], table.t th[data-field="neg_pct"] { text-align: center; }
.isbar { display: flex; height: 8px; width: 100%; min-width: 7rem; border-radius: 4px; overflow: hidden; margin-top: 3px; }
.isbar span { display: block; height: 100%; }
.bandbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; margin-bottom: 6px; }
.bandbar span { display: block; height: 100%; }
.eq { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
.eq .node { flex: 1 1 5rem; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 6px 8px; min-width: 5rem; }
.eq .node .lab { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-fg-muted); }
.eq .node .v { font-family: var(--font-anthropic-sans); font-size: 18px; font-weight: 500; }
.eq .node .b { font-size: 11px; color: var(--color-fg-muted); }
.eq .op { align-self: center; color: var(--color-fg-muted); }
[data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
[data-dash-source-state=empty] { color: transparent; }
.fail { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); min-height: 60px; }
.fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }
.stale { display: none; margin-bottom: var(--cds-gap-md); padding: 8px 12px; border-radius: var(--cds-radius); border: 1px solid var(--color-warn); color: var(--color-warn); font-size: 13px; }
.xp-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--cds-gap-md); margin: 8px 0 var(--cds-gap-sm); }
.xp-field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-fg-muted); min-width: 0; }
.xp-field select { font: inherit; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 5px 8px; min-width: 12rem; max-width: 100%; }
.xp-head { margin: 0 0 6px; font-size: var(--cds-font-size-body); }
.xp-msg { color: var(--color-warn); }
.xp-chart { min-height: 260px; }
.xp-details { margin-top: 8px; }
.xp-details summary { cursor: pointer; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
@media (max-width: 480px) { .xp-field, .xp-field select { width: 100%; min-width: 0; } }
</style>

<div class="pc">
  <div class="pc-head">
    <div>
      <h1 class="pc-brand"><b>Pet Circle</b> Weekly Trading Dashboard</h1>
      <p class="pc-week"><span data-source="cal" data-field="fy_wk" class="dash-skeleton">—</span></p>
      <div class="pc-sub"><span data-source="cal" data-field="period_str">—</span> · plan basis: <span data-source="cal" data-field="plan_label">—</span> · excl GST · 445 trading weeks, Mon to Sun</div>
    </div>
    <div class="pc-sub" id="pc-refresh">Refreshed automatically every Monday at 8am Sydney time from the warehouse.</div>
  </div>
  <div class="stale" id="pc-stale"></div>
  <div class="pc-tabs" role="tablist" id="pc-tabs"></div>

  <section class="pc-panel" id="highlights" role="tabpanel"></section>
  <section class="pc-panel" id="cx" role="tabpanel" hidden></section>
  <section class="pc-panel" id="commercial" role="tabpanel" hidden></section>
  <section class="pc-panel" id="media" role="tabpanel" hidden></section>
  <section class="pc-panel" id="customer" role="tabpanel" hidden></section>
  <section class="pc-panel" id="autodelivery" role="tabpanel" hidden></section>
  <section class="pc-panel" id="category" role="tabpanel" hidden></section>
  <section class="pc-panel" id="price" role="tabpanel" hidden></section>
  <section class="pc-panel" id="inventory" role="tabpanel" hidden></section>
  <section class="pc-panel" id="operations" role="tabpanel" hidden></section>
</div>
<script src="explorer.js"></script>
<script src="app.js"></script>
